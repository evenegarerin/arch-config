# Kitty configuration
# translated from nixos-config/home/kitty.nix

enable_audio_bell no
shell zsh
shell_integration disabled

# font_family JetBrainsMono Nerd Font
# font_size 14

remember_window_size no
window_padding_width 15

background_opacity 0.8

# NOTE: scrollbar_*_opacity are not stock kitty options (kept for parity with
# the original nix config; kitty will warn and ignore unknown keys).
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

confirm_os_window_close 0
