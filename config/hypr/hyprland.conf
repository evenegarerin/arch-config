# Hyprland configuration
# translated from nixos-config/home/hyprland.nix

###############################################################################
# Environment
###############################################################################

# cursor (see config/gtk-* and the borealis-cursors package)
env = XCURSOR_THEME,Borealis-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Borealis-cursors
env = HYPRCURSOR_SIZE,24

# hyprshot save location (replaces hyprshot.nix saveLocation)
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots

###############################################################################
# Autostart
###############################################################################

exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprlock
exec-once = kitty
exec-once = waybar
exec-once = nm-applet
exec-once = swaync
exec-once = wl-clip-persist --clipboard regular
exec-once = systemctl --user start hyprpolkitagent

###############################################################################
# Monitors
###############################################################################

monitor = ,preferred, auto, 1

###############################################################################
# Window rules
###############################################################################

windowrule = fullscreenstate 0 0, fullscreenstate:* 1

###############################################################################
# Look & feel
###############################################################################

general {
    gaps_in = 3
    gaps_out = 6
}

decoration {
    rounding = 10
}

input {
    kb_layout = de
    numlock_by_default = true
}

misc {
    focus_on_activate = true
    vrr = 0
    disable_splash_rendering = true
}

cursor {
    hide_on_key_press = true
    inactive_timeout = 3
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animation = windows, 1, 6, default
animation = fade, 1, 6, default
animation = workspaces, 1, 6, default

###############################################################################
# Keybindings
###############################################################################

bind = SUPER, RETURN, exec, kitty
bind = SUPER, D, exec, ~/.config/wofi/wofi-into-empty-workspace.sh
bind = SUPER SHIFT, D, exec, wofi --show drun -a -i
bind = SUPER, Q, exec, if [ $(hyprctl activeworkspace -j | jq -r .windows) -le 1 ]; then hyprctl dispatch killactive; hyprctl dispatch workspace previous; else hyprctl dispatch killactive; fi
bind = SUPER, F, fullscreen
bind = SUPER, L, exec, hyprlock --grace 1
bind = SUPER, N, exec, sh -c 'out=$(hyprctl dispatch swapwindow r 2>&1); echo "$out" | grep -qx "ok" || hyprctl dispatch swapwindow l'

# screenshot (hyprshot)
bind = , PRINT, exec, hyprshot -m region
bind = SHIFT, PRINT, exec, hyprshot -m output

# media / function keys
bind = , XF86AudioLowerVolume, exec, pactl -- set-sink-volume 0 -10%
bind = , XF86AudioRaiseVolume, exec, pactl -- set-sink-volume 0 +10%
bind = , XF86AudioMute, exec, pactl -- set-sink-mute 0 toggle
bind = , XF86AudioMicMute, exec, pactl -- set-source-mute 0 toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl s +10%

bind = , XF86PickupPhone, exec, playerctl play
bind = , XF86HangupPhone, exec, playerctl -a pause

bind = , F1, exec, playerctl --player=playerctld play-pause

# lock on lid close, only if there are no other monitors connected
bindl = , switch:on:Lid Switch, exec, sh -c '[ $(hyprctl -j monitors | jq length) -eq 1 ] && hyprlock --immediate-render'

bind = SUPER, J, workspace, -1
bind = SUPER, K, workspace, +1

bind = SUPER SHIFT, J, movecurrentworkspacetomonitor, -1
bind = SUPER SHIFT, K, movecurrentworkspacetomonitor, +1

bind = SUPER, H, cyclenext

bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER, R, submap, resize

###############################################################################
# Resize submap
###############################################################################

submap = resize

binde = , J, resizeactive, -18 0
binde = , K, resizeactive, 18 0
binde = , H, resizeactive, 0 10
binde = , L, resizeactive, 0 -10

bind = , catchall, submap, reset
bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset
